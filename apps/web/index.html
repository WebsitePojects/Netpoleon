<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1f1f" />
    <title>Netpoleon WMS</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Blocking on purpose: it runs before first paint so the saved theme never flashes. -->
    <script src="/theme-boot.js"></script>
    <link rel="preload" as="image" href="/img/mark.png" />
    <!--
      The preloader is styled here, not in the stylesheet: the stylesheet arrives with the
      script, and until then this markup would show as bare unstyled content.
    -->
    <style>
      html {
        background: #1f1f1f;
      }
      body {
        margin: 0;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: #1f1f1f;
        color: #f5f5f5;
        transition:
          opacity 520ms cubic-bezier(0.2, 0.7, 0.2, 1),
          visibility 0s 520ms;
      }
      .boot[data-done='true'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot[data-done='true'] .boot-stage {
        transform: scale(1.12);
      }
      .boot-stage {
        position: relative;
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        transition: transform 520ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      /* Two arcs orbit the mark in opposite directions. */
      .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #f15a22;
        border-right-color: rgb(241 90 34 / 0.25);
        animation: boot-spin 1.1s cubic-bezier(0.6, 0.1, 0.4, 0.9) infinite;
      }
      .boot-ring + .boot-ring {
        inset: 10px;
        border-top-color: #d5d5d5;
        border-right-color: rgb(255 255 255 / 0.16);
        animation-duration: 1.7s;
        animation-direction: reverse;
      }
      .boot-mark {
        width: 38px;
        height: 38px;
        animation: boot-pulse 1.9s ease-in-out infinite;
      }
      .boot-name {
        font-family: 'Manrope Variable', system-ui, 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #b5b5b5;
      }
      .boot-bar {
        width: 148px;
        height: 3px;
        border-radius: 3px;
        background: #303030;
        overflow: hidden;
      }
      .boot-bar span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #f15a22, #ffb08f);
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.86);
          opacity: 0.55;
        }
        50% {
          transform: scale(1);
          opacity: 1;
          filter: drop-shadow(0 0 14px rgb(241 90 34 / 0.6));
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring,
        .boot-mark,
        .boot-bar span {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Preloader: outside #root so React mounting does not remove it mid-animation. -->
    <div class="boot" id="boot" role="status" aria-label="Loading Netpoleon WMS">
      <div class="boot-stage">
        <span class="boot-ring"></span>
        <span class="boot-ring"></span>
        <img class="boot-mark" src="/img/mark.png" alt="" width="38" height="38" />
      </div>
      <div class="boot-name">Netpoleon WMS</div>
      <div class="boot-bar"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
